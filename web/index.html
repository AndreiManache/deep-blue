<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deep Blue — Voice-first nutrition tracking</title>
    <meta
      name="description"
      content="Deep Blue is a voice-first nutrition tracker. Talk about what you ate; it logs your meals, tracks calories and macros, and coaches you by voice."
    />

    <!-- Installable web app. On iOS, "Add to Home Screen" runs the app in
         standalone mode, which — unlike a Safari tab — remembers the
         microphone grant across launches, so the permission prompt stops
         reappearing on every visit. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fdfdff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Deep Blue" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
